name: SeekerHub
options:
  bundleIdPrefix: com.gotseeker.app
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: BountyApp/Info.plist
    ENABLE_PREVIEWS: NO
    DEVELOPMENT_TEAM: "B646TQ3P36"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.gotseeker.app
    PRODUCT_NAME: SeekerHub
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: PRODUCTION

targets:
  Seeker:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - SeekerUITests
    sources:
      - path: BountyApp
        excludes:
          - "Info.plist"
          - "Resources/Assets.xcassets/**"
    info:
      path: BountyApp/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
        BackendBaseHost: "https://api.gotseeker.com"
        PrivacyPolicyURL: "https://gotseeker.com/privacy"
        TermsOfServiceURL: "https://gotseeker.com/terms"
        NSCameraUsageDescription: "Seeker needs camera access to complete tasks"
        NSLocationWhenInUseUsageDescription: "Seeker needs location to find nearby tasks"
        NSLocationAlwaysAndWhenInUseUsageDescription: "Seeker needs location for task matching and photo watermark"
        CFBundleURLTypes:
          - CFBundleURLName: com.gotseeker.app
            CFBundleURLSchemes:
              - gotseeker

  SeekerUITests:
    type: bundle.ui-testing
    platform: iOS
    testTarget: Seeker
    buildSettings:
      WRAPPER_EXTENSION: xctest
      TEST_TARGET_NAME: Seeker
      PRODUCT_BUNDLE_IDENTIFIER: com.gotseeker.app.SeekerUITests
    sources:
      - path: SeekerUITests
    dependencies:
      - target: Seeker
        embed: false
