name: CD

# 仅在 CI 工作流成功完成后触发，保证质量门禁（lint/vet/build/test）通过才部署
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    name: Deploy to HK (from GitHub)
    # 仅当 CI 的结果为 success 且来源分支为 main 才部署。
    # 注意：workflow_run 不支持 branches 过滤，必须在 if 里显式判断 head_branch。
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch deployed commit SHA
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH (password)
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HK_HOST }}
          username: ${{ secrets.HK_USER }}
          password: ${{ secrets.HK_PASSWORD }}
          script: |
            set -euo pipefail
            echo "==> CD deploy target: ${{ secrets.HK_HOST }} dir=${{ secrets.HK_DEPLOY_DIR }}"
            cd "${{ secrets.HK_DEPLOY_DIR }}"
            echo "==> current git HEAD before fetch: $(git rev-parse HEAD)"
            bash scripts/deploy-remote.sh "${{ steps.sha.outputs.sha }}" "${{ secrets.HK_DEPLOY_DIR }}"
            echo "==> deployed HEAD after: $(git rev-parse HEAD)"

      # 部署后核对线上版本 == 目标 SHA，并跑一次冒烟（公网）
      - name: Verify deployed version
        id: verify
        run: |
          EXPECTED="${{ steps.sha.outputs.sha }}"
          BASE="${{ secrets.HK_PUBLIC_BASE_URL }}"
          echo "==> expecting version=$EXPECTED on $BASE"
          for i in $(seq 1 10); do
            GOT=$(curl -fsS "$BASE/healthz" | grep -o '"version":"[^"]*"' | cut -d'"' -f4 || true)
            if [ "$GOT" = "$EXPECTED" ]; then
              echo " [OK] online version matches $EXPECTED"
              exit 0
            fi
            echo " wait ($i): got '$GOT' want '$EXPECTED'"
            sleep 5
          done
          echo " [FAIL] online version did not reach $EXPECTED"
          exit 1

      # 部署失败自动回滚到上一个版本
      - name: Rollback on failure
        if: ${{ failure() && steps.deploy.outcome == 'failure' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HK_HOST }}
          username: ${{ secrets.HK_USER }}
          password: ${{ secrets.HK_PASSWORD }}
          script: |
            set -e
            cd "${{ secrets.HK_DEPLOY_DIR }}"
            echo "==> 部署失败，回滚到 bountyapp:prev"
            if ! docker inspect bountyapp:prev >/dev/null 2>&1; then
              echo " [FATAL] bountyapp:prev 镜像不存在，无法自动回滚"
              exit 1
            fi
            # 停止当前服务并用 prev 镜像重新启动
            docker compose -f deploy/docker-compose.prod.yml down --remove-orphans
            docker container prune -f 2>/dev/null || true
            GIT_SHA=prev docker compose -f deploy/docker-compose.prod.yml up -d
            curl -fsS http://127.0.0.1:8080/healthz && echo " [OK] rollback done" || echo " [WARN] rollback healthz FAILED"

