# 80 -> 443 重定向（所有域名）
server {
    listen 80;
    server_name api.gotseeker.com gotseeker.com www.gotseeker.com 129.226.138.231;
    return 301 https://$host$request_uri;
}

# API 子域名：反向代理到后端（Let's Encrypt 证书）
server {
    listen 443 ssl;
    http2 on;
    server_name api.gotseeker.com;

    ssl_certificate     /etc/letsencrypt/live/api.gotseeker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gotseeker.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 根域名 / www：隐私政策、服务条款等静态页面（Let's Encrypt 证书）
server {
    listen 443 ssl;
    http2 on;
    server_name gotseeker.com www.gotseeker.com;

    ssl_certificate     /etc/letsencrypt/live/api.gotseeker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gotseeker.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /opt/bountyapp/www;
    index privacy.html;

    location = /privacy {
        return 302 /privacy.html;
    }
    location = /terms {
        return 302 /terms.html;
    }
    location / {
        try_files $uri $uri/ /privacy.html;
    }
}

# 直接用 IP 访问：保留自签 RSA 证书（临时调试）
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /opt/bountyapp/caddy/cert.pem;
    ssl_certificate_key /opt/bountyapp/caddy/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
