services:
  redis:
    image: redis:7-alpine
    container_name: bounty-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: ./backend
    image: bountyapp:latest
    container_name: bountyapp
    restart: unless-stopped
    env_file: ./.env
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - redis

volumes:
  redisdata:
